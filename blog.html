<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Dr. Aidin Jalilzadeh</title>
    <meta name="description" content="Blog and research writing by Dr. Aidin Jalilzadeh." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  </head>
  <body>
    <div class="page-shell">
      <header id="site-header"></header>
      <main class="page">
        <section class="page-intro">
          <p class="eyebrow" id="dynamic-eyebrow"></p>
          <h1 id="dynamic-title"></h1>
          <p id="dynamic-description"></p>
        </section>
        
        <section id="blog-list" class="post-list"></section>
      </main>
      <footer id="site-footer"></footer>
    </div>
    
    <!-- KaTeX JS - MUST load before blog.js -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script type="module" src="scripts/blog.js"></script>
  </body>
</html>
